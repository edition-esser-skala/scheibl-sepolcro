    principal: true
    notes: "13 parts, 36 × 23 cm. Original wrapper and org part are bound in cardboard coated with black marbled paper; the remaining parts are included loose. Hand-ruled paper, 12 staves per page (10 mm) in brown ink and music in same ink. A clean manuscript copy by several unknown hands. Title on wrapper (fol. 1r): Oratorium | Ad S. Sepulchrum. | a | Canto. | Alto. | Tenore { Concerto. | Baſso Ripieno. | Violinis 2bus. | Alto Viola. | Con | Organo. | et | Violone. | Authore Joanne Adamo Scheibl. | 755.”. The wrapper also contains three performance dates (fol.~1r, top): “[1]769 in parasc[eve]”, “[1]769 ad Aug [illegible]”, and “[1]770 in parasc[eve]”. Parts held and extent: S solo and coro (2~fol.), A solo and coro (2), T solo and coro (2), B coro (1), vl 1 (3×; 4, 4, 2), vl 2 (3×; 4, 4, 2), vla (2), vlne (4), org (6)."
  B2:
    siglum: A-GÖ
    shelfmark: 1780
    date: ca. 1760
    url: https://db.klostermusiksammlungen.at/scores/4401
    license: public domain
    notes: "8 parts, 33 × 21.5 cm.other Hand-ruled paper, 12 staves per page (10 mm) in light brown ink and music in black ink. A clean manuscript copy by P.~Joseph Unterberger (1731–88; Regens chori in the Göttweig abbey in 1754–69). Title on wrapper (fol. 1r): Oratorium. | Ad S: Sepulchrum. | à | Canto | Alto | Tenore. { Concerti | Baſso Ripieno. | Violinis 2|b|u|s. | Alto viola, | con | Organo, | Authore Joanne Adamo Scheibl | Comparavit R: P: Joseph”. The wrapper also contains five performance dates (fol.~2v, top): “30 April [1]764”, “5 April [1]7[?]”, “29 Martij [1]766”, “2 April [1]768”, and “29 Martij [1]771”. Parts held and extent: S solo and coro (2 fol.), A solo and coro (2), T solo and coro (2), B coro (1), vl 1 (4), vl 2 (4), vla (2), org (4)."
